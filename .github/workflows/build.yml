name: Build Complete libimobiledevice Stack (Win & Linux)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make autoconf automake libtool pkg-config patch
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libxml2
            zip

      - name: Compile Source Stack with Dynamic Patching (Windows)
        run: |
          export WORKSPACE_DIR="$(pwd)"
          export PREFIX="$WORKSPACE_DIR/build_output"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export CFLAGS="-I$PREFIX/include -O2"
          export LDFLAGS="-L$PREFIX/lib"
          
          mkdir -p "$PREFIX"

          # Reusable compilation and patching function
          build_repo() {
            local REPO=$1
            shift
            local EXTRA_ARGS="$@"
            
            echo "========================================"
            echo "Building $REPO..."
            echo "========================================"
            
            git clone --depth 1 "https://github.com/libimobiledevice/$REPO.git"
            cd "$REPO"
            
            # Dynamically detect and apply patches if a corresponding folder exists
            if [ -d "$WORKSPACE_DIR/patches/$REPO" ]; then
              for patch_file in "$WORKSPACE_DIR/patches/$REPO"/*.patch; do
                # Check if file exists to handle empty directories safely
                if [ -f "$patch_file" ]; then
                  echo "--> Applying patch: $(basename "$patch_file")"
                  git apply "$patch_file"
                fi
              done
            fi
            
            ./autogen.sh --prefix="$PREFIX" $EXTRA_ARGS
            make -j$(nproc)
            make install
            cd "$WORKSPACE_DIR"
          }

          # Execute builds sequentially
          build_repo "libplist" "--without-cython"
          build_repo "libimobiledevice-glue"
          build_repo "libusbmuxd"
          build_repo "libimobiledevice" "--without-cython"
          build_repo "libtatsu"
          build_repo "libideviceactivation"
          build_repo "libirecovery"
          build_repo "idevicerestore"
          build_repo "ideviceinstaller"

      - name: Resolve Windows DLLs and Package
        run: |
          export PREFIX="$(pwd)/build_output"
          mkdir -p release_package
          
          cp "$PREFIX/bin/"*.exe release_package/
          cp "$PREFIX/bin/"*.dll release_package/ 2>/dev/null || true
          
          for file in release_package/*.exe release_package/*.dll; do
            ldd "$file" | grep -i '/mingw64/bin/' | awk '{print $3}' | xargs -I '{}' cp -n '{}' release_package/ || true
          done
          
          cd release_package && zip -r ../libimobiledevice-windows-latest.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-windows-binaries
          path: libimobiledevice-windows-latest.zip
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libssl-dev libcurl4-openssl-dev libreadline-dev libzip-dev libxml2-dev check

      - name: Compile Source Stack with Dynamic Patching (Linux)
        run: |
          export WORKSPACE_DIR="$(pwd)"
          export PREFIX="$WORKSPACE_DIR/build_output"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CFLAGS="-I$PREFIX/include -O2"
          export LDFLAGS="-L$PREFIX/lib -Wl,-rpath='\$\$ORIGIN/../lib'"
          
          mkdir -p "$PREFIX"

          build_repo() {
            local REPO=$1
            shift
            local EXTRA_ARGS="$@"
            
            echo "========================================"
            echo "Building $REPO..."
            echo "========================================"
            
            git clone --depth 1 "https://github.com/libimobiledevice/$REPO.git"
            cd "$REPO"
            
            if [ -d "$WORKSPACE_DIR/patches/$REPO" ]; then
              for patch_file in "$WORKSPACE_DIR/patches/$REPO"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "--> Applying patch: $(basename "$patch_file")"
                  git apply "$patch_file"
                fi
              done
            fi
            
            ./autogen.sh --prefix="$PREFIX" $EXTRA_ARGS
            make -j$(nproc)
            make install
            cd "$WORKSPACE_DIR"
          }

          build_repo "libplist" "--without-cython"
          build_repo "libimobiledevice-glue"
          build_repo "libusbmuxd"
          build_repo "libimobiledevice" "--without-cython"
          build_repo "libtatsu"
          build_repo "libideviceactivation"
          build_repo "libirecovery"
          build_repo "idevicerestore"
          build_repo "ideviceinstaller"

      - name: Package Linux Binaries
        run: |
          export PREFIX="$(pwd)/build_output"
          tar -czvf libimobiledevice-linux-latest.tar.gz -C "$PREFIX" bin lib

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-linux-binaries
          path: libimobiledevice-linux-latest.tar.gz
          retention-days: 14
