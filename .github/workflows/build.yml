name: Build Complete libimobiledevice Stack (Win & Linux)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Polls upstream repositories every hour

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Fetch Upstream Commits
        run: |
          REPOS=(libplist libimobiledevice-glue libusbmuxd libtatsu libimobiledevice libideviceactivation libirecovery idevicerestore ideviceinstaller)
          > current_hashes.txt
          for repo in "${REPOS[@]}"; do
            git ls-remote "https://github.com/libimobiledevice/$repo.git" HEAD | awk '{print $1}' >> current_hashes.txt
          done
          echo "Current Upstream HEADs:"
          cat current_hashes.txt

      - name: Check State Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: current_hashes.txt
          key: upstream-state-${{ hashFiles('current_hashes.txt') }}

      - name: Evaluate Build Necessity
        id: check
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "New upstream commits detected or manual run triggered. Proceeding with build."
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected. Skipping build."
          fi

  build-windows:
    needs: check-upstream
    if: needs.check-upstream.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf automake libtool pkg-config
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libxml2
            zip

      - name: Compile Source Stack with Dynamic Scripts (Windows)
        run: |
          export WORKSPACE_DIR="$(pwd)"
          export PREFIX="$WORKSPACE_DIR/build_output"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:/ucrt64/lib/pkgconfig"
          export CFLAGS="-I$PREFIX/include -O2"
          export LDFLAGS="-L$PREFIX/lib"
          
          mkdir -p "$PREFIX"

          build_repo() {
            local REPO=$1
            shift
            local EXTRA_ARGS="$@"

            echo "::group::Building $REPO"
            
            git clone --depth 1 "https://github.com/libimobiledevice/$REPO.git"
            cd "$REPO"
            
            if [ -d "$WORKSPACE_DIR/patches/$REPO" ]; then
              for script in "$WORKSPACE_DIR/patches/$REPO"/*.sh; do
                if [ -f "$script" ]; then
                  echo "--> Executing injection script: $(basename "$script")"
                  bash "$script"
                fi
              done
            fi
            
            ./autogen.sh --prefix="$PREFIX" $EXTRA_ARGS
            make -j$(nproc)
            make install
            cd "$WORKSPACE_DIR"

            echo "::endgroup::"
          }

          build_repo "libplist" "--without-cython"
          build_repo "libimobiledevice-glue"
          build_repo "libusbmuxd"
          build_repo "libtatsu"
          build_repo "libimobiledevice" "--without-cython"
          build_repo "libideviceactivation"
          build_repo "libirecovery"
          build_repo "idevicerestore"
          build_repo "ideviceinstaller"

      - name: Resolve Windows DLLs and Package
        run: |
          export PREFIX="$(pwd)/build_output"
          mkdir -p release_package
          
          cp "$PREFIX/bin/"*.exe release_package/
          cp "$PREFIX/bin/"*.dll release_package/ 2>/dev/null || true
          
          for file in release_package/*.exe release_package/*.dll; do
            ldd "$file" | grep -i '/ucrt64/bin/' | awk '{print $3}' | xargs -I '{}' cp -n '{}' release_package/ || true
          done
          
          cd release_package && zip -r ../libimobiledevice-windows-latest.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-windows-binaries
          path: libimobiledevice-windows-latest.zip
          retention-days: 14

  build-linux:
    needs: check-upstream
    if: needs.check-upstream.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libssl-dev libcurl4-openssl-dev libreadline-dev libzip-dev libxml2-dev check libusb-1.0-0-dev

      - name: Compile Source Stack with Dynamic Scripts (Linux)
        run: |
          export WORKSPACE_DIR="$(pwd)"
          export PREFIX="$WORKSPACE_DIR/build_output"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/lib64/pkgconfig:$PREFIX/lib/x86_64-linux-gnu/pkgconfig"
          export CFLAGS="-I$PREFIX/include -O2"
          export LDFLAGS="-L$PREFIX/lib -Wl,-rpath='\$\$ORIGIN/../lib'"
          
          mkdir -p "$PREFIX"

          build_repo() {
            local REPO=$1
            shift
            local EXTRA_ARGS="$@"

            echo "::group::Building $REPO"
            
            git clone --depth 1 "https://github.com/libimobiledevice/$REPO.git"
            cd "$REPO"
            
            if [ -d "$WORKSPACE_DIR/patches/$REPO" ]; then
              for script in "$WORKSPACE_DIR/patches/$REPO"/*.sh; do
                if [ -f "$script" ]; then
                  echo "--> Executing injection script: $(basename "$script")"
                  bash "$script"
                fi
              done
            fi
            
            ./autogen.sh --prefix="$PREFIX" $EXTRA_ARGS
            make -j$(nproc)
            make install
            cd "$WORKSPACE_DIR"

            echo "::endgroup::"
          }
          
          build_repo "libplist" "--without-cython"
          build_repo "libimobiledevice-glue"
          build_repo "libusbmuxd"
          build_repo "libtatsu"
          build_repo "libimobiledevice" "--without-cython"
          build_repo "libideviceactivation"
          build_repo "libirecovery"
          build_repo "idevicerestore"
          build_repo "ideviceinstaller"

      - name: Package Linux Binaries
        run: |
          export PREFIX="$(pwd)/build_output"
          tar -czvf libimobiledevice-linux-latest.tar.gz -C "$PREFIX" bin lib

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimobiledevice-linux-binaries
          path: libimobiledevice-linux-latest.tar.gz
          retention-days: 14
